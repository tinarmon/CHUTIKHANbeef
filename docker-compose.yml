services:
  portfolio:
    image: business-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8080}:8000"
    environment:
      APP_NAME: "Chutikhan Portfolio"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      PORTFOLIO_ENABLE_APPLE: "${PORTFOLIO_ENABLE_APPLE:-true}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-*}"
